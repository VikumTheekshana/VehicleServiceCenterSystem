<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Electric Amber Gradient -->
    <linearGradient id="electricAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Metallic Titanium Gradient -->
    <linearGradient id="metallicGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background rounded square -->
  <rect width="500" height="500" rx="100" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="6" />

  <!-- Outer Cybernetic Ring (Telemetry Radar Grid) -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="10 8" />
  <circle cx="250" cy="250" r="160" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.3" />
  
  <!-- Outer Gear Teeth (Mechanical Engineering Core) -->
  <g transform="translate(250, 250)">
    <!-- 8 Gear Cog Teeth -->
    <path d="M -30,-175 L 30,-175 L 24,-145 L -24,-145 Z" fill="url(#metallicGear)" stroke="#475569" stroke-width="1" />
    <path d="M -30,-175 L 30,-175 L 24,-145 L -24,-145 Z" transform="rotate(45)" fill="url(#metallicGear)" stroke="#475569" stroke-width="1" />
    <path d="M -30,-175 L 30,-175 L 24,-145 L -24,-145 Z" transform="rotate(90)" fill="url(#metallicGear)" stroke="#475569" stroke-width="1" />
    <path d="M -30,-175 L 30,-175 L 24,-145 L -24,-145 Z" transform="rotate(135)" fill="url(#metallicGear)" stroke="#475569" stroke-width="1" />
    <path d="M -30,-175 L 30,-175 L 24,-145 L -24,-145 Z" transform="rotate(180)" fill="url(#metallicGear)" stroke="#475569" stroke-width="1" />
    <path d="M -30,-175 L 30,-175 L 24,-145 L -24,-145 Z" transform="rotate(225)" fill="url(#metallicGear)" stroke="#475569" stroke-width="1" />
    <path d="M -30,-175 L 30,-175 L 24,-145 L -24,-145 Z" transform="rotate(270)" fill="url(#metallicGear)" stroke="#475569" stroke-width="1" />
    <path d="M -30,-175 L 30,-175 L 24,-145 L -24,-145 Z" transform="rotate(315)" fill="url(#metallicGear)" stroke="#475569" stroke-width="1" />

    <!-- Gear Body Circle -->
    <circle cx="0" cy="0" r="148" fill="#090d16" stroke="url(#neonCyan)" stroke-width="4" filter="url(#glowFilter)" />
  </g>

  <!-- Glowing Hexagonal Circuit Core -->
  <polygon points="250,135 345,190 345,310 250,365 155,310 155,190" fill="#0d1527" stroke="#00f5ff" stroke-width="3" opacity="0.8" />

  <!-- Aerodynamic Sports Vehicle Silhouette (Cyber-Precision Vector) -->
  <path d="M 170,275 
           C 185,255 210,248 235,230 
           C 255,215 285,215 315,235 
           C 335,250 350,265 365,275
           L 360,290 
           C 350,295 335,282 320,282
           C 305,282 295,296 280,296
           L 220,296
           C 205,296 195,282 180,282
           C 165,282 155,292 145,290 Z" 
        fill="url(#neonCyan)" filter="url(#glowFilter)" />

  <!-- Futuristic Cockpit Glass Glow -->
  <path d="M 235,235 C 255,224 280,224 298,237 L 310,256 C 285,253 250,253 222,256 Z" fill="#ffffff" opacity="0.9" />

  <!-- Neon Glowing Wheels (Rotors) -->
  <circle cx="185" cy="288" r="18" fill="#020617" stroke="#00f5ff" stroke-width="4" />
  <circle cx="185" cy="288" r="7" fill="#f59e0b" />
  <circle cx="325" cy="288" r="18" fill="#020617" stroke="#00f5ff" stroke-width="4" />
  <circle cx="325" cy="288" r="7" fill="#f59e0b" />

  <!-- Real-Time AI Optical Telemetry Scan Beam -->
  <line x1="140" y1="205" x2="360" y2="205" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 6" filter="url(#glowFilter)">
    <animate attributeName="y1" values="180;320;180" dur="3s" repeatCount="indefinite" />
    <animate attributeName="y2" values="180;320;180" dur="3s" repeatCount="indefinite" />
  </line>

  <!-- Typography Brand Accent -->
  <text x="250" y="420" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="8">
    AUTO<tspan fill="#00f5ff">OS</tspan>
  </text>
  <text x="250" y="445" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="4">
    ENTERPRISE WORKSHOP CORE
  </text>
</svg>
